<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Kaspi</title>
    <style>
        :root {
            --kaspi-red: #E41E31;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fff; color: #1A1A1A; overflow: hidden; height: 100vh; width: 100vw; }
        
        /* Каждый экран — отдельный контейнер (никаких наложений) */
        .screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            background: #fff;
            overflow: hidden;
        }
        .screen.active { display: block; }

        .screen img.full-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 1 !important;
            background: #fff;
        }

        /* НЕВИДИМЫЕ (прозрачные) зоны нажатия */
        .click-zone {
            position: absolute;
            background: transparent;
            z-index: 100;
            cursor: pointer;
        }

        /* ==== ПИН-КОД (IMG_9393) ==== */
        .pin-header {
            position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
            text-align: center; z-index: 200;
        }
        .pin-header h2 { font-size: 16px; font-weight: 500; color: #333; }
        .pin-avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: #e0e0e0; margin: 15px auto 10px auto;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px; color: #888;
        }
        .pin-header p { font-size: 14px; color: #666; margin-top:  10px; }
        
        .pin-dots {
            display: flex; gap: 20px; justify-content: center; margin-top: 20px;
        }
        .pin-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: #ddd;
            transition: background 0.2s;
        }
        .pin-dot.filled { background: var(--kaspi-red); }

        .pin-keypad {
            position: absolute; top: 45%; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 350px;
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            z-index: 200;
        }
        .pin-key {
            background: transparent;
            border: none;
            font-size:32px;
            font-weight: 400;
            color: #333;
            padding: 15px 0;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }
        .pin-key:active { background: #f0f0f0; border-radius: 50%; }
        .pin-key.icon { font-size: 24px; color: #E41E31; }
        
        .pin-forgot {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
            color: #007AFF; font-size: 15px; cursor: pointer;
            z-index: 200;
        }

        /* Нижнее меню */
        .bottom-nav-zones {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 8%;
            display: flex; z-index: 150;
        }
        .nav-zone { flex: 1; cursor: pointer; background: transparent; }

        /* Модальное окно */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 500;
            display: none; justify-content: center; align-items: center;
            flex-direction: column; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; border-radius: 15px; padding: 20px;
            width: 100%; max-width: 400px; text-align: center;
        }
        .modal-content h3 { margin-bottom: 15px; font-size: 18px; }
        .modal-content p { color: #666; margin-bottom: 15px; font-size: 14px; }
        .modal-btn {
            display: block;
            background: var(--kaspi-red); color: white; border: none;
            padding: 15px; border-radius: 10px; font-size: 16px; font-weight: 600;
            width: 100%; cursor: pointer; margin-top: 10px;
            text-align: center;
        }
        .modal-btn:active { opacity: 0.8; }
        .modal-btn.close { background: #eee; color: #333; }
        .modal-btn input { display: none; }
        .preview-img {
            max-width: 100%; max-height: 200px; border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- ==== ЭКРАН 1: ПИН-КОД (IMG_9393) ==== -->
    <div id="pin-screen" class="screen active">
        <img src="IMG_9393.jpeg" class="full-image" alt="Pin">
        
        <div class="pin-header">
            <div class="pin-avatar">👤</div>
            <h2>Степан П.</h2>
            <p>Код доступа</p>
            <div class="pin-dots">
                <div class="pin-dot" id="d1"></div>
                <div class="pin-dot" id="d2"></div>
                <div class="pin-dot" id="d3"></div>
                <div class="pin-dot" id="d4"></div>
            </div>
        </div>

        <div class="pin-keypad">
            <button class="pin-key" onclick="enterPin(1)">1</button>
            <button class="pin-key" onclick="enterPin(2)">2</button>
            <button class="pin-key" onclick="enterPin(3)">3</button>
            <button class="pin-key" onclick="enterPin(4)">4</button>
            <button class="pin-key" onclick="enterPin(5)">5</button>
            <button class="pin-key" onclick="enterPin(6)">6</button>
            <button class="pin-key" onclick="enterPin(7)">7</button>
            <button class="pin-key" onclick="enterPin(8)">8</button>
            <button class="pin-key" onclick="enterPin(9)">9</button>
            <button class="pin-key icon" onclick="deletePin()">☝️</button>
            <button class="pin-key" onclick="enterPin(0)">0</button>
            <button class="pin-key icon" onclick="deletePin()">⌫</button>
        </div>

        <div class="pin-forgot">Забыли код доступа?</div>
    </div>

    <!-- ==== ЭКРАН 2: ГЛАВНОЕ МЕНЮ (IMG_9384) ==== -->
    <div id="main-screen" class="screen">
        <img src="IMG_9384.jpeg" class="full-image" alt="Main">
        
        <!-- Кнопка "Переводы" — ровно там, где нарисовано на скрине -->
        <!-- Иконка "Переводы" — 4-я в верхнем ряду (крайняя справа) -->
        <div class="click-zone" style="top: 24%; left: 75%; width: 22%; height: 9%;" onclick="showScreen('transfers-menu-screen')"></div>

        <div class="bottom-nav-zones">
            <div class="nav-zone"></div>
            <div class="nav-zone"></div>
            <div class="nav-zone"></div>
            <div class="nav-zone"></div>
        </div>
    </div>

    <!-- ==== ЭКРАН 3: МЕНЮ ПЕРЕВОДОВ (93506373...) ==== -->
    <div id="transfers-menu-screen" class="screen">
        <img src="93506373-9AB9-4C57-A44F-3AD35A21A289.jpeg" class="full-image" alt="Transfers Menu">
        
        <!-- Вкладка "История" (правая часть таба) -->
        <div class="click-zone" style="top: 14%; left: 50%; width: 50%; height: 8%;" onclick="showScreen('transfers-history-screen')"></div>
        <!-- Вкладка "Мои переводы" (левая часть таба, не работает) -->
        <div class="click-zone" style="top: 14%; left: 0; width: 50%; height: 8%;" onclick=""></div>
        <!-- Кнопка "Назад" (стрелка в левом верхнем) -->
        <div class="click-zone" style="top: 2%; left: 2%; width: 10%; height: 6%;" onclick="showScreen('main-screen')"></div>

        <div class="bottom-nav-zones">
            <div class="nav-zone" onclick="showScreen('main-screen')"></div>
            <div class="nav-zone"></div>
            <div class="nav-zone"></div>
            <div class="nav-zone"></div>
        </div>
    </div>

    <!-- ==== ЭКРАН 4: ИСТОРИЯ ПЕРЕВОДОВ (IMG_9394) ==== -->
    <div id="transfers-history-screen" class="screen">
        <img src="IMG_9394.jpeg" class="full-image" alt="History">
        
        <!-- Вкладка "Мои переводы" -->
        <div class="click-zone" style="top: 14%; left: 0; width: 50%; height: 8%;" onclick="showScreen('transfers-menu-screen')"></div>
        <!-- Вкладка "История" (остаёмся) -->
        <div class="click-zone" style="top: 14%; left: 50%; width: 50%; height: 8%;" onclick=""></div>
        <!-- Кнопка "Назад" -->
        <div class="click-zone" style="top: 2%; left: 2%; width: 10%; height: 6%;" onclick="showScreen('transfers-menu-screen')"></div>

        <!-- 4 перевода — каждый открывает загрузку файла -->
        <div class="click-zone" style="top: 30%; left: 0; width: 100%; height: 8%;" onclick="openFileUpload('Перевод 1: Kaspi Gold 200,00 ₸')"></div>
        <div class="click-zone" style="top: 42%; left: 0; width: 100%; height: 8%;" onclick="openFileUpload('Перевод 2: Kaspi Gold 15 000,00 ₸')"></div>
        <div class="click-zone" style="top: 54%; left: 0; width: 100%; height: 8%;" onclick="openFileUpload('Перевод 3: Kaspi Gold 5 000,00 ₸')"></div>
        <div class="click-zone" style="top: 66%; left: 0; width: 100%; height: 8%;" onclick="openFileUpload('Перевод 4: Kaspi Gold 11 260,00 ₸')"></div>

        <div class="bottom-nav-zones">
            <div class="nav-zone" onclick="showScreen('main-screen')"></div>
            <div class="nav-zone"></div>
            <div class="nav-zone"></div>
            <div class="nav-zone"></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЗАГРУЗКИ ФАЙЛА -->
    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Перевод</h3>
            <p>Прикрепить чек или файл к переводу?</p>
            <img id="modal-preview" class="preview-img" style="display:none;">
            <label class="modal-btn" onclick="document.getElementById('modal-file-input').click()">Выбрать файл</label>
            <input type="file" id="modal-file-input" accept="image/*" onchange="previewFile(event)">
            <button class="modal-btn close" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        // === ПИН-КОД ===
        let currentPin = "";
        const correctPin = "8514";
        
        function enterPin(num) {
            if (currentPin.length < 4) currentPin += num;
            updateDots();
            if (currentPin.length === 4) checkPin();
        }
        function deletePin() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updateDots();
            }
        }
        function updateDots() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById(`d${i}`);
                if (i <= currentPin.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            }
        }
        function checkPin() {
            if (currentPin === correctPin) {
                // Верный код → на главное меню
                showScreen('main-screen');
                currentPin = "";
                updateDots();
            } else {
                // Неверный → просто очищаем
                currentPin = "";
                updateDots();
            }
        }

        // === НАВИГАЦИЯ ===
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // === МОДАЛЬНОЕ ОКНО ===
        function openFileUpload(transferName) {
            document.getElementById('modal-title').innerText = transferName;
            document.getElementById('modal-preview').style.display = 'none';
            document.getElementById('modal-preview').src = '';
            document.getElementById('modal-file-input').value = '';
            document.getElementById('upload-modal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('upload-modal').classList.remove('active');
        }
        function previewFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('modal-preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
